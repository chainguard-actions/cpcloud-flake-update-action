name: Test with flake-utils dependency
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock nix binary (simulates no update)
        run: |
          mkdir -p /tmp/mock-bin
          printf '#!/bin/sh\n# Mock nix: do nothing (simulates dependency already at latest version)\necho "mock nix called with: $*" >&2\nexit 0\n' > /tmp/mock-bin/nix
          chmod +x /tmp/mock-bin/nix
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Run action to update flake-utils dependency
        id: action
        uses: .
        with:
          dependency: flake-utils
          pull-request-token: ${{ github.token }}
          pull-request-author: "Test User <test@example.com>"
          github-token: ${{ github.token }}

      - name: Assert action completed for flake-utils
        run: |
          echo "Action completed for flake-utils dependency"
          echo "PASS"
