name: Test custom optional inputs (branch prefix, labels, merge method)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up fake nix that does nothing (simulates no update available)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/nix" << 'EOF'
          #!/bin/sh
          # Fake nix: for "nix flake lock --update-input <dep>", do nothing
          # so flake.lock remains unchanged
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/nix"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up a minimal flake.lock with nixpkgs dependency
        run: |
          cat > "$GITHUB_WORKSPACE/flake.lock" << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1672411825,
                  "narHash": "sha256-r8LVwXJ4NiiW2llqaN214MW+jjekRgIlctuAMyxx7go=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "8507321ef814735e8cdd24047dd191bc0a0b228c",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable-small",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

      - name: Run flake-update-action with custom optional inputs
        id: action
        uses: .
        with:
          dependency: nixpkgs
          pull-request-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-author: "Test Bot <bot@example.com>"
          pull-request-merge-method: "squash"
          delete-branch: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-branch-prefix: "deps/update-"
          pull-request-labels: "dependencies,nix"
          include-merge-commits: "false"
          automerge: "false"

      - name: Assert action completed without error
        env:
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
        run: |
          echo "PR number output: '$PR_NUMBER'"
          # Since nix is mocked to be a no-op, flake.lock won't change,
          # so no PR should be created even with custom options
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "" ]; then
            echo "FAIL: expected no PR to be created when dependency is unchanged"
            exit 1
          fi
          echo "PASS: action accepted all custom optional inputs and completed successfully"
