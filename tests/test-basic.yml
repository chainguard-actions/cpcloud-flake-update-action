name: Test basic flake-update-action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal flake.lock for testing
        run: |
          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixpkgs-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF
          echo "flake.lock created"
          cat flake.lock

      - name: Verify action inputs are accepted (expect failure at nix step)
        id: action
        uses: .
        continue-on-error: true
        with:
          dependency: nixpkgs
          pull-request-token: fake-token-for-testing
          pull-request-author: "Test Bot <test@example.com>"
          pull-request-merge-method: rebase
          delete-branch: "false"
          automerge: "false"

      - name: Assert action ran (failed at nix step as expected without nix installed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail because nix is not installed in the test environment
          # This is expected behavior - we're testing that the action structure is valid
          # and inputs are properly accepted
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action succeeded (nix must be available)"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed as expected (nix not available in test environment)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS"
