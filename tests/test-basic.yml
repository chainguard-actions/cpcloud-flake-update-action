name: Test basic flake-update-action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action (expected to fail without nix/real tokens)
        id: action
        uses: .
        continue-on-error: true
        with:
          dependency: nixpkgs
          pull-request-token: fake-token
          pull-request-author: "Test User <test@example.com>"

      - name: Verify action.yml exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Verify required inputs are declared in action.yml
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/action.yml")

          for input in dependency pull-request-token pull-request-author; do
            if ! echo "$CONTENT" | grep -q "$input:"; then
              echo "FAIL: required input '$input' not found in action.yml"
              exit 1
            fi
            echo "PASS: required input '$input' found"
          done

      - name: Verify optional inputs have defaults
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/action.yml")

          # pull-request-merge-method should default to rebase
          if ! echo "$CONTENT" | grep -q "rebase"; then
            echo "FAIL: default 'rebase' not found for pull-request-merge-method"
            exit 1
          fi
          echo "PASS: pull-request-merge-method default 'rebase' found"

          # delete-branch should default to false
          if ! echo "$CONTENT" | grep -q "delete-branch"; then
            echo "FAIL: delete-branch input not found"
            exit 1
          fi
          echo "PASS: delete-branch input found"

          # automerge should default to false
          if ! echo "$CONTENT" | grep -q "automerge"; then
            echo "FAIL: automerge input not found"
            exit 1
          fi
          echo "PASS: automerge input found"

      - name: Verify action uses composite runner
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/action.yml")
          if ! echo "$CONTENT" | grep -q "using: composite"; then
            echo "FAIL: action does not use composite runner"
            exit 1
          fi
          echo "PASS: action uses composite runner"

      - name: Verify nix flake lock step is present
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/action.yml")
          if ! echo "$CONTENT" | grep -q "nix flake lock"; then
            echo "FAIL: nix flake lock step not found in action.yml"
            exit 1
          fi
          echo "PASS: nix flake lock step found"
