name: Test basic flake-update-action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action (expected to fail without Nix/tokens)
        id: action
        uses: .
        continue-on-error: true
        with:
          dependency: nixpkgs
          pull-request-token: fake-token
          pull-request-author: "Test User <test@example.com>"

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail in act (no Nix, no real tokens)
          # but it must have been invoked (outcome is not empty)
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action step did not run (outcome is empty)"
            exit 1
          fi
          echo "PASS: action was invoked with outcome=$OUTCOME"

      - name: Assert action.yml has required inputs
        run: |
          ACTION_YML="$GITHUB_WORKSPACE/action.yml"
          if [ ! -f "$ACTION_YML" ]; then
            echo "FAIL: action.yml not found at $ACTION_YML"
            exit 1
          fi
          for input in dependency pull-request-token pull-request-author; do
            if ! grep -q "$input" "$ACTION_YML"; then
              echo "FAIL: required input '$input' not found in action.yml"
              exit 1
            fi
            echo "PASS: input '$input' found"
          done

      - name: Assert optional inputs have correct defaults
        run: |
          ACTION_YML="$GITHUB_WORKSPACE/action.yml"
          if ! grep -q "rebase" "$ACTION_YML"; then
            echo "FAIL: default 'rebase' not found in action.yml"
            exit 1
          fi
          echo "PASS: default merge method 'rebase' found"

          if ! grep -q "delete-branch" "$ACTION_YML"; then
            echo "FAIL: delete-branch input not found in action.yml"
            exit 1
          fi
          echo "PASS: delete-branch input found"

          if ! grep -q "automerge" "$ACTION_YML"; then
            echo "FAIL: automerge input not found in action.yml"
            exit 1
          fi
          echo "PASS: automerge input found"
