name: Test no update scenario (flake dependency unchanged)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up fake nix that does nothing (simulates no update)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/nix" << 'EOF'
          #!/bin/sh
          # Fake nix: for "nix flake lock --update-input <dep>", do nothing
          # so flake.lock remains unchanged, simulating no update available
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/nix"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up a minimal flake.lock in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/flake.lock" << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1672411825,
                  "narHash": "sha256-r8LVwXJ4NiiW2llqaN214MW+jjekRgIlctuAMyxx7go=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "8507321ef814735e8cdd24047dd191bc0a0b228c",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable-small",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

      - name: Run flake-update-action (no update expected)
        id: action
        uses: .
        with:
          dependency: nixpkgs
          pull-request-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-author: "Test User <test@example.com>"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          automerge: "false"
          delete-branch: "false"

      - name: Assert no PR was created (no change in flake.lock)
        env:
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.action.outputs.pull-request-operation }}
        run: |
          echo "PR number: $PR_NUMBER"
          echo "PR operation: $PR_OPERATION"
          # When there's no update, no PR should be created
          # The create_pr step is skipped when rev hasn't changed
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "" ]; then
            echo "FAIL: expected no PR to be created, but got PR number: $PR_NUMBER"
            exit 1
          fi
          echo "PASS: no PR created as expected when dependency is unchanged"
