name: Test flake-update-action with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake nix binary (no-op so flake.lock does not change)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/nix" << 'EOF'
          #!/bin/sh
          # Fake nix: do nothing so flake.lock stays unchanged
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/nix"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up a minimal flake.lock with a known dependency
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Write a minimal flake.nix
          cat > "$GITHUB_WORKSPACE/flake.nix" << 'EOF'
          {
            description = "Test flake";
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
            };
            outputs = { self, nixpkgs }: {};
          }
          EOF

          # Write a minimal flake.lock with a known nixpkgs rev
          cat > "$GITHUB_WORKSPACE/flake.lock" << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1702723167,
                  "narHash": "sha256-cIxAF4Do+B7mQxzRDo/8B9QO0i2ap3i/i6Ujk8kx+Ws=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "7d6929828a2d28eda9d37254ff6be3b6819506ca",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

          git add flake.nix flake.lock
          git commit -m "chore: add flake files"

      - name: Run flake-update-action with all optional inputs specified
        id: action
        uses: .
        with:
          dependency: nixpkgs
          pull-request-token: ${{ github.token }}
          pull-request-author: "Test User <test@example.com>"
          pull-request-merge-method: "squash"
          delete-branch: "true"
          github-token: ${{ github.token }}
          pull-request-branch-prefix: "deps/update-"
          pull-request-labels: "dependencies,nix"
          include-merge-commits: "false"
          automerge: "false"

      - name: Assert action completed with all optional inputs
        run: |
          echo "Action completed successfully with all optional inputs specified"
          echo "PASS"
