name: Test optional inputs - flake-update-action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal flake.nix and flake.lock for testing
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
            };
            outputs = { self, nixpkgs }: {};
          }
          EOF
          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add flake.nix flake.lock
          git commit -m "Add test flake files"

      - name: Invoke flake-update-action with optional inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          dependency: nixpkgs
          pull-request-token: ${{ github.token }}
          pull-request-author: "Test User <test@example.com>"
          pull-request-merge-method: squash
          delete-branch: "true"
          pull-request-branch-prefix: "test/update-"
          pull-request-labels: "dependencies,nix"
          include-merge-commits: "false"
          automerge: "false"
          github-token: ${{ github.token }}

      - name: Assert action was invoked with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail at a known step (nix/dep-info)
          # It should NOT be skipped — skipped means the step was never attempted
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with optional inputs (outcome: $OUTCOME)"
