name: Test custom inputs - branch prefix and labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock nix binary (simulates no update)
        run: |
          mkdir -p /tmp/mock-bin
          printf '#!/bin/sh\n# Mock nix: do nothing (simulates dependency already at latest version)\necho "mock nix called with: $*" >&2\nexit 0\n' > /tmp/mock-bin/nix
          chmod +x /tmp/mock-bin/nix
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Run action with custom branch prefix and labels
        id: action
        uses: .
        with:
          dependency: nixpkgs
          pull-request-token: ${{ github.token }}
          pull-request-author: "Test User <test@example.com>"
          github-token: ${{ github.token }}
          pull-request-branch-prefix: "custom-prefix/update-"
          pull-request-labels: "dependencies,nix"
          include-merge-commits: "false"
          automerge: "false"
          delete-branch: "false"

      - name: Assert action completed with custom inputs
        run: |
          echo "Action completed with custom branch prefix and labels"
          echo "PASS"
